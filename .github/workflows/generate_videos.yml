name: Generate YouTube Shorts

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      -name: Install package
  run: |
    pip install -e .
    # أو بدلاً من ذلك:
    # export PYTHONPATH="${PYTHONPATH}:${{ github.workspace }}"

- name: Run generator
  env:
    OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  run: python -m src.main  # التشغيل كوحدة

      - name: Upload generated videos
        uses: actions/upload-artifact@v4  # ⬅️ الإصدار المحدث
        with:
          name: youtube-shorts
          path: outputs/
          retention-days: 1  # احتفظ بالملفات ليوم واحد فقط
